services:
  voice-client:
    build: .
    image: voice-client-pi:latest
    container_name: voice-client-pi
    restart: unless-stopped
    env_file:
      - .env
    devices:
      - /dev/snd:/dev/snd
    group_add:
      # Typical Debian/RPi OS audio GID; check with: getent group audio
      - "29"
    environment:
      HOME: /home/pi
      # Empty = auto-download into ~/.cache/vosk on first start (survives in volume)
      VOSK_MODEL_PATH: ""
    volumes:
      - vosk-cache:/home/pi/.cache/vosk

volumes:
  vosk-cache:
