services:
  voice-client:
    build: .
    image: voice-client-pi:latest
    container_name: voice-client-pi
    restart: unless-stopped
    env_file:
      - .env
    # Keep ALSA for USB mic/speakers; Pulse covers Bluetooth on the host.
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "29"
    environment:
      HOME: /home/pi
      OWW_MODEL: alexa
      OWW_FRAMEWORK: onnx
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      XDG_RUNTIME_DIR: /run/user/1000
    volumes:
      # Host PulseAudio (Bluetooth A2DP/HFP lives here)
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /home/server-pi/.config/pulse/cookie:/home/pi/.config/pulse/cookie:ro
